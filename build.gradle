plugins {
	id 'java-library'
	id 'maven-publish'
	id 'org.springframework.boot' version '3.2.4'
	id 'io.spring.dependency-management' version '1.1.4'
}

group = 'com.adarsh'
version = '0.0.7-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(18)
	}
}

repositories {
	mavenCentral()
}

publishing{
	publications{
		mavenJava(MavenPublication){
			from components.java

		}
	}

	repositories{
		maven{
			url = uri('C:\\Users\\HP\\Desktop\\RideBooking-EntityService\\RideBooking-EntityService')
		}
	}

}

dependencies {

	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'

	// Source: https://mvnrepository.com/artifact/org.springframework.boot/spring-boot-starter-validation
	implementation group: 'org.springframework.boot', name: 'spring-boot-starter-validation', version: '3.5.16'

	runtimeOnly 'com.mysql:mysql-connector-j'

	compileOnly 'org.projectlombok:lombok'
	annotationProcessor 'org.projectlombok:lombok'

	developmentOnly 'org.springframework.boot:spring-boot-devtools'

	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	implementation 'com.fasterxml.jackson.core:jackson-annotations'

	// Flyway Core & MySQL Extension
	/*implementation 'org.flywaydb:flyway-core:10.15.0'
	implementation 'org.flywaydb:flyway-mysql:10.15.0'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'  */

}
tasks.named('test') {
	useJUnitPlatform()
}
